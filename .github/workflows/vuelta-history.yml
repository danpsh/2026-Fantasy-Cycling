name: Scrape Vuelta history

# One-off backfill: builds vuelta-results-2023-2025.xlsx from ProCyclingStats.
# Manual only — run once per year (year=2023, then 2024, then 2025). Each run
# opens a PR so you can review before merging to main.

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Vuelta year to backfill (2023, 2024, or 2025)"
        default: "2023"
        required: true
      out:
        description: "Output file"
        default: "vuelta-results-2023-2025.xlsx"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install procyclingstats openpyxl curl_cffi

      - name: Scrape results
        env:
          YEAR: ${{ github.event.inputs.year }}
          OUT: ${{ github.event.inputs.out || 'vuelta-results-2023-2025.xlsx' }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scripts/scrape_vuelta_history.py

      - name: Open pull request (review before publish)
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Backfill Vuelta ${{ github.event.inputs.year }} results"
          title: "Vuelta ${{ github.event.inputs.year }} history backfill"
          body: |
            Automated scrape from ProCyclingStats for Vuelta ${{ github.event.inputs.year }}.
            Review the rider names/points, then merge to publish.
          branch: vuelta-history-update-${{ github.event.inputs.year }}
          add-paths: |
            ${{ github.event.inputs.out || 'vuelta-results-2023-2025.xlsx' }}
